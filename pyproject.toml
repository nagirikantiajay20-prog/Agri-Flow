[project]
name = "agriflow-backend"
version = "0.1.0"
description = "AgriFlow (AgroSeq) unified FastAPI backend for Web + Mobile"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "boto3>=1.34",
    "psycopg2-binary>=2.9",
    "firebase-admin>=6.5,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "faker>=25.0",
    "fakeredis>=2.23",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Deliberately scoped set — correctness (E/F) and import hygiene (I) only.
# Style-preference rule families (FURB, UP, DTZ, PIE, RUF) are noisy for
# this codebase's conventions (e.g. Decimal("5") over Decimal(5) for money
# literals is intentional, not a style bug) and are left off rather than
# suppressed line-by-line.
select = ["E", "F", "I"]
ignore = ["E501"]  # long descriptive comments/docstrings are intentional here; not wrapping them for a hard limit

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "performance: page-load budget checks; seed a large dataset and are slower than the rest of the suite",
]
