version: "3.9"

# NOTE (Master Plan §2): Postgres is NOT included here on purpose — this
# backend is designed to connect to the SAME Postgres instance the
# current Supabase project already runs on (set DATABASE_URL in .env to
# that connection string, ideally via Supabase's pooler). Spinning up a
# separate local Postgres for "development" risks diverging from the
# real reconciled schema (Master Plan §7). If you genuinely need a
# disposable local DB for early prototyping before Phase 0's schema
# reconciliation is done, uncomment the `postgres` service below.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    env_file:
      - .env
    depends_on:
      - redis
    command: arq app.workers.worker.WorkerSettings

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

